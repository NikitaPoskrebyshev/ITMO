[tool.poetry]
name = "backend-academy-2026-python-template"
version = "0.1.0"
description = ""
package-mode = false
authors = ["g.tarasov <g.tarasov@tbank.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
httpx = "^0.27.0"
asyncpg = "^0.31.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
greenlet = "^3.0.0"
aiokafka = "^0.11.0"
redis = {version = "^5.0.0", extras = ["asyncio"]}
tenacity = "^9.1.4"
slowapi = "^0.1.9"
aiobreaker = "^1.2.0"


[tool.poetry.group.dev.dependencies]
respx = "^0.21.0"
black = "^24.8.0"
isort = "^5.13.2"
ruff = "^0.6.1"
pytest = "*"
pytest-cov = "*"
pytest-deadfixtures = "*"
pytest-mock = "*"
pytest-repeat = "*"
pytest-asyncio = "*"
mypy = "^1.19.1"
testcontainers = {extras = ["postgres", "kafka", "redis"], version = "^4.0.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
# Расскомментируйте следующую строку, если используете Pydantic
# plugins = ['pydantic.mypy']
allow_redefinition = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
exclude = "^(.*/)?test_[\\w]*\\.py$|conftest\\.py|tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
